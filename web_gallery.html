<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.4rem;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background: #334155;
      transform: translateY(-2px);
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .carousel-container {
      overflow-x: auto;
      padding-bottom: 15px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--card-bg);
    }
    .carousel-container::-webkit-scrollbar {
      height: 8px;
    }
    .carousel-container::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }
    .grid-track {
      display: flex;
      gap: 16px;
    }
    .video-card {
      flex: 0 0 280px;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(99, 102, 241, 0.3);
    }
    .video-card.selected {
      border-color: var(--success);
      background: #0f291e;
    }
    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 158px;
      background: #000;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .duration-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .check-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      transition: all 0.2s ease;
    }
    .video-card.selected .check-badge {
      background: var(--success);
      border-color: var(--success);
    }
    .card-body {
      padding: 12px 14px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    footer {
      margin-top: auto;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 YouTube Playlist Gallery</h1>
    <span class="badge" id="totalCount">0 Videos</span>
  </header>

  <div class="controls-bar">
    <button class="btn btn-primary" onclick="selectAll()">⚡ Select All</button>
    <button class="btn" onclick="clearAll()">❌ Clear</button>
    <button class="btn btn-primary" style="background:#22c55e;" onclick="submitSelection()">🚀 Download Selected (<span id="selCount">0</span>)</button>
  </div>

  <div class="carousel-container">
    <div class="grid-track" id="gridTrack">
      <!-- Dynamic Video Cards inserted by JS -->
    </div>
  </div>

  <footer>
    <span style="font-size:0.85rem; color:var(--text-muted);">Side-scroll horizontally to browse cards</span>
  </footer>

  <script>
    let playlistData = [];
    let selectedIndices = new Set();

    function loadData(data) {
      playlistData = data;
      document.getElementById('totalCount').innerText = `${playlistData.length} Videos`;
      render();
    }

    function render() {
      const track = document.getElementById('gridTrack');
      track.innerHTML = '';
      playlistData.forEach((item, index) => {
        const isSel = selectedIndices.has(index);
        const card = document.createElement('div');
        card.className = `video-card ${isSel ? 'selected' : ''}`;
        card.onclick = () => toggleSelect(index);
        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${item.thumb}" alt="thumb" loading="lazy">
            <div class="check-badge">${isSel ? '✓' : ''}</div>
            <div class="duration-tag">${item.duration}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${index + 1}. ${item.title}</div>
            <div class="card-meta">${item.uploader || 'YouTube'}</div>
          </div>
        `;
        track.appendChild(card);
      });
      document.getElementById('selCount').innerText = selectedIndices.size;
    }

    function toggleSelect(index) {
      if (selectedIndices.has(index)) {
        selectedIndices.delete(index);
      } else {
        selectedIndices.add(index);
      }
      render();
    }

    function selectAll() {
      playlistData.forEach((_, i) => selectedIndices.add(i));
      render();
    }

    function clearAll() {
      selectedIndices.clear();
      render();
    }

    function submitSelection() {
      if (selectedIndices.size === 0) {
        alert('Please select at least one video to download!');
        return;
      }
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify(Array.from(selectedIndices)));
      } else {
        alert(`Selected ${selectedIndices.size} videos! Close web view and return to Telegram.`);
      }
    }
  </script>
</body>
</html>
