<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.2rem;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #334155;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
    }
    .carousel-container {
      overflow-x: auto;
      padding-bottom: 15px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--card-bg);
    }
    .grid-track {
      display: flex;
      gap: 14px;
    }
    .video-card {
      flex: 0 0 240px;
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .video-card.selected {
      border-color: var(--success);
      background: #0f291e;
    }
    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 135px;
      background: #000;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .duration-tag {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .check-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
    }
    .video-card.selected .check-badge {
      background: var(--success);
      border-color: var(--success);
    }
    .card-body {
      padding: 10px 12px;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 YouTube Playlist Gallery</h1>
    <span class="badge" id="totalCount">0 Videos</span>
  </header>

  <div class="controls-bar">
    <button class="btn btn-primary" onclick="selectAll()">⚡ Select All</button>
    <button class="btn" onclick="clearAll()">❌ Clear</button>
    <button class="btn btn-primary" style="background:#22c55e;" onclick="submitSelection()">🚀 Download (<span id="selCount">0</span>)</button>
  </div>

  <div class="carousel-container">
    <div class="grid-track" id="gridTrack">
      <div class="empty-state">Send a playlist link on Telegram to view your video cards here!</div>
    </div>
  </div>

  <script>
    let playlistData = [];
    let selectedIndices = new Set();

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawData = urlParams.get('data');
      if (rawData) {
        try {
          playlistData = JSON.parse(decodeURIComponent(rawData));
          document.getElementById('totalCount').innerText = `${playlistData.length} Videos`;
          render();
        } catch(e) {
          console.error(e);
        }
      }
    };

    function render() {
      const track = document.getElementById('gridTrack');
      if (!playlistData.length) return;
      track.innerHTML = '';
      playlistData.forEach((item, index) => {
        const isSel = selectedIndices.has(index);
        const card = document.createElement('div');
        card.className = `video-card ${isSel ? 'selected' : ''}`;
        card.onclick = () => toggleSelect(index);
        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${item.thumb}" alt="thumb" loading="lazy">
            <div class="check-badge">${isSel ? '✓' : ''}</div>
            <div class="duration-tag">${item.duration}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${index + 1}. ${item.title}</div>
          </div>
        `;
        track.appendChild(card);
      });
      document.getElementById('selCount').innerText = selectedIndices.size;
    }

    function toggleSelect(index) {
      if (selectedIndices.has(index)) {
        selectedIndices.delete(index);
      } else {
        selectedIndices.add(index);
      }
      render();
    }

    function selectAll() {
      playlistData.forEach((_, i) => selectedIndices.add(i));
      render();
    }

    function clearAll() {
      selectedIndices.clear();
      render();
    }

    function submitSelection() {
      if (selectedIndices.size === 0) {
        alert('Please select at least one video!');
        return;
      }
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify(Array.from(selectedIndices)));
        window.Telegram.WebApp.close();
      } else {
        alert(`Selected ${selectedIndices.size} videos!`);
      }
    }
  </script>
</body>
</html>
